site_name: Nextmini Documentation
repo_url: https://github.com/iqua/nextmini
repo_name: iqua/nextmini

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Google Sans Code
  palette:
    # Light mode
    - scheme: astral-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: astral-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.instant
    #- navigation.tabs
    - content.code.copy
    # - content.action.edit
    # - content.action.view
    - content.tooltips
    - content.version # enables the version dropdown in the header

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iqua/nextmini

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Getting Started:
      - What is Nextmini?: design/introduction.md
      - Quick Start: getting-started/quickstart.md
      - Docs: getting-started/docs-and-api.md
  - Design:
      - Architecture:
          - Overview: design/architecture.md
          - Controller: design/controller.md
          - Dataplane: design/dataplane.md
      - Messages & Protocol: design/messages.md
      - Routing: design/routing.md
      - User-space flows:
          - SmolTCP flows: design/smoltcp-flows.md
          - Lossless flows: design/lossless-flows.md
      - MAX mode:
          - MAX mode: design/max-mode.md
          - Proxy flows (SOCKS5): design/proxy-flows.md
      - Multicast Groups: design/multicast-groups.md
      - Python dataplane API: design/python-api.md
      - Configuration Reference: design/config-reference.md
  - Examples:
      - TUN (overlay):
          - Simple (iperf3): examples/simple.md
          - Topology & Routes: examples/routes.md
          - PyTorch (DDP): examples/pytorch.md
      - Namespace (Linux):
          - Namespace scaling: examples/namespace.md
          - ns-flow: examples/ns-flow.md
      - User-space flows:
          - Lossless flows: examples/simple-flow.md
          - SmolTCP flows: examples/smoltcp-flows.md
      - Proxy flows:
          - splice-test: examples/splice-test.md
          - curl: examples/curl.md
      - Python API examples:
          - RL Training (GSM8K): examples/rl.md
          - LP Toy Demo: examples/lp-toy.md
  - Deployment:
      - Single host (Docker Compose): examples/single-host.md
      - Bare Metal: examples/bare-metal.md
      - Manual deployment: examples/public-network.md
      - Multi-node (Docker Swarm): examples/simple-swarm.md
      - Batch Sync (SSH + rsync): examples/batch-sync.md
      - Local Controller + Fly.io (experimental): examples/localserver-flyio.md
  - Testing:
      - Cargo Test Guide: testing/cargo-test.md
