site_name: Nextmini Documentation
repo_url: https://github.com/iqua/nextmini
repo_name: iqua/nextmini

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Google Sans Code
  palette:
    # Light mode
    - scheme: astral-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: astral-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.instant
    #- navigation.tabs
    - content.code.copy
    # - content.action.edit
    # - content.action.view
    - content.tooltips
    - content.version # enables the version dropdown in the header

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iqua/nextmini

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - What is Nextmini?: design/introduction.md
      - Quickstart (Docker): getting-started/quickstart.md
      - Build & Run (native): getting-started/build-and-run.md
      - Docs & API: getting-started/docs-and-api.md
  - Guides:
      - Examples:
          - Overview: examples/overview.md
          - TUN (overlay):
              - Simple (iperf3): examples/simple.md
              - Topology & Routes: examples/routes.md
              - PyTorch (DDP): examples/pytorch.md
              - Namespace (node scaling): examples/namespace.md
          - User-space flows:
              - SmolTCP flows (WRR): examples/smoltcp-test.md
              - Lossless flows (controller-managed): examples/simple-flow.md
              - ns-flow (flow scaling): examples/ns-flow.md
          - Proxy flows (MAX mode):
              - MAX mode (internal): examples/simple-max.md
              - SOCKS5 Proxy (splice-test / curl): examples/proxy.md
          - Python API + multicast:
              - Python API quickstart: examples/pytorch_python_api.md
              - Multicast Flow Lifecycle: examples/multicast-flow.md
              - Multicast Docker: examples/multicast-docker.md
              - LP Toy Demo: examples/lp-toy.md
              - LP Multicast Tree Selection: examples/lp.md
              - RL Training (GSM8K): examples/rl.md
      - Deployment:
          - Single host (Docker Compose): examples/single-host.md
          - Bare Metal: examples/bare-metal.md
          - Multi-node (manual, no swarm): examples/public-network.md
          - Multi-node (Docker Swarm): examples/simple-swarm.md
          - Batch Sync (SSH + rsync): examples/batch-sync.md
          - Local Controller + Fly.io (experimental): examples/localserver-flyio.md
      - Tools:
          - Ring All-Reduce Launcher: examples/ring-emu.md
      - Testing:
          - Cargo Test Guide: testing/cargo-test.md
          - Python API Validation: testing/python-api-validation.md
  - Concepts:
      - Architecture: design/architecture.md
      - Controller: design/controller.md
      - Dataplane Node: design/dataplane.md
      - Messages & Protocol: design/messages.md
      - Routing Internals: design/routing.md
      - User-Space Flows: design/user-space-flows.md
      - Lossless Sessions: design/lossless_config.md
      - Proxy Flows (MAX + SOCKS5): design/proxy-flows.md
      - Multicast Groups: design/multicast-groups.md
      - Transport Configuration: design/configuration.md
  - Reference:
      - Configuration Reference: design/config-reference.md
  - API:
      - Rust API (rustdoc): design/rust-api.md
      - Python Dataplane API: design/python-api.md
