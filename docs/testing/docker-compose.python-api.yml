version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: python-api-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgusr
      POSTGRES_PASSWORD: pgpwrd
      POSTGRES_DB: nextmini
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ../controller/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      python_api:
        ipv4_address: 172.31.0.2

  controller:
    build:
      context: ../..
      dockerfile: controller/Dockerfile
    image: nextmini_controller
    container_name: python-api-controller
    hostname: controller
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace:cached
      - ./configs/controller.toml:/var/nextmini/config.toml
    working_dir: /workspace
    command: /bin/bash -c "sleep 5 && /var/nextmini/controller --config /var/nextmini/config.toml"
    networks:
      python_api:
        ipv4_address: 172.31.0.3
    ports:
      - "3000:3000"

  receiver-shell:
    build:
      context: ../..
      dockerfile: docs/testing/scripts/Dockerfile.harness
    image: nextmini_python_harness
    container_name: python-api-receiver
    hostname: receiver
    depends_on:
      - controller
    volumes:
      - ../..:/workspace:cached
    working_dir: /workspace
    environment:
      NEXTMINI_CONFIG: /workspace/docs/testing/configs/node_receiver.toml
      NEXTMINI_DST_NODE: "1"
    networks:
      python_api:
        ipv4_address: 172.31.0.4
    command: sleep infinity

  sender-shell:
    build:
      context: ../..
      dockerfile: docs/testing/scripts/Dockerfile.harness
    image: nextmini_python_harness
    container_name: python-api-sender
    hostname: sender
    depends_on:
      - controller
    volumes:
      - ../..:/workspace:cached
    working_dir: /workspace
    environment:
      NEXTMINI_CONFIG: /workspace/docs/testing/configs/node_sender.toml
      NEXTMINI_DST_NODE: "2"
    networks:
      python_api:
        ipv4_address: 172.31.0.5
    command: sleep infinity

networks:
  python_api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
