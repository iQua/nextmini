# Generated deterministic WR scenario. DO NOT interpret any value as a measurement.
# Region names and provider-network facts follow public provider documentation; latency,
# capacity, queue, jitter, and topology magnitudes are representative public-cloud envelope
# inputs synthesized from plans/wansim-plan.md, not provider guarantees or reverse engineering.
# vm_nic_cap_bps: representative VM ceiling; vm_nic_queue_bytes: modeled finite NIC queue.
# intra_region_rtt_ns/access_one_way_ns/trunk propagation_ns: representative latency inputs.
# jitter_max_ppm/jitter_epoch_ns: +/-5 percent piecewise-constant delay, updated every 100 ms.
# background_reference_rate_bps: denominator for the 30/50/70 percent offered-load sweep.
# trunk capacity_bps/queue_bytes: modeled shared transit service, not physical inventory.
# relay_regions and rtt_matrix_ns are deterministic generator outputs.
# Public identity/cap context only (not RTT/topology measurements): AWS regions and EC2 network
# bandwidth docs; Google Cloud locations, Network Service Tiers, and VM bandwidth docs; and
# DigitalOcean regional-availability and Droplet-network-limit docs. Exact URLs are recorded in
# plans/wansim-wr-report.md.
