[package]
name = "namespace_init"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.5.0"
env_logger = "0.11"
futures = { version="0.3.29" }
http-body-util = "0.1.0"
hyper = "1.1.0"
hyper-util = { version= "0.1.2", features = ["full"]}
log = "0.4.20"
nix = { version = "0.30", features = ["sched", "hostname"] }
rand = "0.9"
rtnetlink = "0.18"
serde = { version = "1.0.193", features = ["derive"]}
serde_json = "1.0.108"
toml = "0.9"
tokio = { version = "1.35.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nextmini = { path = "../dataplane" }
