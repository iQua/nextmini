version: "3.8"

services:
    aya-test:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: aya-ebpf-test
        privileged: true
        cap_add:
            - SYS_ADMIN
            - NET_ADMIN
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
        environment:
            - RUST_LOG=info
        ports:
            - "8080:8080"
        stdin_open: true
        tty: true
        command: >
            sh -c "
              echo 'eBPF Test Environment Ready!' &&
              echo 'Binary location: /usr/local/bin/aya' &&
              echo 'Usage:' &&
              echo '  docker exec aya-ebpf-test aya' &&
              echo '  docker exec aya-ebpf-test python3 -m http.server 8080' &&
              tail -f /dev/null
            "

networks:
    default:
        driver: bridge
