services:
  proxy:
    build: .
    container_name: tcp-proxy
    ports:
      - "8080:8080"
    depends_on:
      - iperf-server
    networks:
      - proxy-network

  test-client:
    image: alpine:latest
    container_name: test-client
    command: sh -c "apk add --no-cache netcat-openbsd iperf3 && sleep infinity"
    depends_on:
      - proxy
      - iperf-server
    networks:
      - proxy-network

  iperf-server:
    image: alpine:latest
    container_name: iperf-server
    command: sh -c "apk add --no-cache iperf3 && iperf3 -s -p 5201"
    ports:
      - "8082:5201"
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
