[package]
name = "nextmini"
version = "0.1.0"
edition = "2024"
default-run = "nextmini"

[[bin]]
name = "nextmini"
path = "src/main.rs"

[dependencies]
nextmini-messages = { path = "../messages" }
byteorder = "1.5"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
serde = "1.0"
toml = "0.9"
futures = "0.3"
network-interface = "2"
tokio = { version = "1", features = ["full", "rt"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
tun-rs = { version = "2", features = ["async"] }
url = "2"
clap-serde-derive = "0.2"
num_cpus = "1"
console-subscriber = "0.4"
s2n-quic = "1"
rand = "0.9"
approx = "0.5"
rmp-serde = "1.3"
crossbeam-queue = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
jumphash = "0.1"
ahash = "0.8"
flume = "0.11"
smoltcp = "0.12"
tokio-splice = "0.2"
nix = { version = "0.30", features = ["sched", "hostname", "fs"] }
rtnetlink = "0.18"
once_cell = "1"

[features]
default = []
# Enable per-flow QUIC streams: one QUIC send stream per inner FlowId,
# and a stream-accept loop for receiving per-flow streams on the server.
quic_per_flow = []
# Enable QUIC DATAGRAM transport for TUN payloads (RFC 9221). This requires
# the s2n-quic "unstable-provider-datagram" feature.
quic_datagram = ["s2n-quic/unstable-provider-datagram"]
