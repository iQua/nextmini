[package]
name = "strato"
version = "0.1.0"
edition = "2024"
default-run = "strato"

[[bin]]
name = "strato"
path = "src/main.rs"

[[bin]]
name = "cert-gen"
path = "src/cert-gen.rs"

[dependencies]
byteorder = "1.5"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
serde = "1.0"
toml = "0.8"
futures = "0.3"
network-interface = "2.0"
tokio = { version = "1", features = ["full", "rt"] }
tokio-tungstenite = "0.26"
tun-rs = { version = "2", features = ["async"] }
url = "2.3.1"
clap-serde-derive = "0.2.0"
num_cpus = "1.15.0"
console-subscriber = "0.4"
rcgen = { version = "0.13", features = ["pem"] }
s2n-quic = "1"
fxhash = "0.2"
rand = "0.9"
approx = "0.5.1"
rmp-serde = "1.3"
serde_json = "1.0"
crossbeam-queue = "0.3.12"
chrono = { version = "0.4", features = ["serde"] }
strato-messages = { path = "../messages" }
