[package]
name = "controller"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "rt"] }
tokio-tungstenite = "0.27"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_json = "1.0"
toml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
chrono = "0.4"
futures-util = "0.3"
nextmini-messages = { path = "../messages" }
tracing = "0.1"
tracing-subscriber = "0.3" 
petgraph = "0.8.2"
