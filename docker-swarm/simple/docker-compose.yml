version: "3.8"

networks:
  nextmini-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 172.16.8.0/24

services:
  postgres:
    image: postgres:alpine
    hostname: postgres
    environment:
      POSTGRES_USER: pgusr
      POSTGRES_PASSWORD: pgpwrd
      POSTGRES_DB: nextmini
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../controller/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      nextmini-network:
        ipv4_address: 172.16.8.2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  controller:
    image: nextmini_controller
    hostname: controller
    networks:
      nextmini-network:
        ipv4_address: 172.16.8.3
    stdin_open: true
    volumes:
      - ./controller-config.toml:/var/nextmini/config.toml
    depends_on:
      - postgres
    ports:
      - 3000:3000
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
    command: /bin/bash -c "sleep 5 && /var/nextmini/controller"

  node1:
    image: nextmini_datapath
    hostname: node1
    networks:
      nextmini-network:
        ipv4_address: 172.16.8.4
    stdin_open: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - controller
    cap_add:
      - NET_ADMIN
    deploy:
      placement:
        constraints:
          - node.role == manager
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"

  node2:
    image: nextmini_datapath
    hostname: node2
    networks:
      nextmini-network:
        ipv4_address: 172.16.8.5
    stdin_open: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - controller
      - node1
    cap_add:
      - NET_ADMIN
    deploy:
      placement:
        constraints:
          - node.hostname == nextmini-snapshot
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"

  node3:
    image: nextmini_datapath
    hostname: node3
    networks:
      nextmini-network:
        ipv4_address: 172.16.8.6
    stdin_open: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - controller
      - node2
    cap_add:
      - NET_ADMIN
    deploy:
      placement:
        constraints:
          - node.hostname == nextmini-snapshot-2
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"

volumes:
  postgres_data:
