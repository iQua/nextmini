version: "3.8"

networks:
  nextmini-network:
    driver: overlay
    attachable: true

services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: pgusr
      POSTGRES_PASSWORD: pgpwrd
      POSTGRES_DB: nextmini
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nextmini-network
    volumes:
      - ../../controller/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  controller:
    image: nextmini_controller
    build:
      context: ../../
      dockerfile: ./controller/Dockerfile
    networks:
      - nextmini-network
    stdin_open: true
    volumes:
      - ./controller-config.toml:/var/nextmini/config.toml
    depends_on:
      - postgres
    ports:
      - 3000:3000
    command: /bin/bash -c "sleep 5 && /var/nextmini/controller"
    deploy:
      placement:
        constraints:
          - node.role == manager

  node1:
    image: nextmini_datapath
    build:
      context: ../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      - nextmini-network
    stdin_open: true
    privileged: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
    depends_on:
      - controller
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"
    deploy:
      placement:
        constraints:
          - node.role == manager

  node2:
    image: nextmini_datapath
    build:
      context: ../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      - nextmini-network
    stdin_open: true
    privileged: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
    depends_on:
      - controller
      - node1
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"
    deploy:
      placement:
        constraints:
          - node.hostname == nextmini-snapshot

  node3:
    image: nextmini_datapath
    build:
      context: ../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      - nextmini-network
    stdin_open: true
    privileged: true
    volumes:
      - ./config.toml:/var/nextmini/config.toml
      - ../../tools/:/var/nextmini/tools
    depends_on:
      - controller
      - node2
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://controller:3000"
    deploy:
      placement:
        constraints:
          - node.hostname == nextmini-snapshot-2
