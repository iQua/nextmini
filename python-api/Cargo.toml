[package]
name = "nextmini_py"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "nextmini_py"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
once_cell = "1"
pyo3 = { version = "0.28", features = ["abi3-py313"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

nextmini = { path = "../dataplane", package = "nextmini" }
nextmini-messages = { path = "../messages", package = "nextmini-messages" }

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }

[features]
default = ["python-extension", "dev-tests"]
python-extension = ["nextmini/python-extension"]
dev-tests = ["pyo3/auto-initialize"]
