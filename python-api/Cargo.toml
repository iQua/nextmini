[package]
name = "nextmini_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "nextmini_py"
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
once_cell = "1"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py313"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.9"
tracing = "0.1"

nextmini = { path = "../dataplane", package = "nextmini" }
nextmini-messages = { path = "../messages", package = "nextmini-messages" }
