# 4-Node Full Mesh Topology—to match routes example

[solver]
# LP solver type: "mFlow" or "multi_commodity"
type = "multi_commodity"

[topology]
# Node IDs must match Nextmini node registration order
nodes = [1, 2, 3, 4]

# Full mesh edges (each pair connected)
edges = [
    [1, 2],
    [1, 3],
    [1, 4],
    [2, 3],
    [2, 4],
    [3, 4],
]

# Link capacity in Mbps
default_capacity = 1000

# Multicast session: Node 1 broadcasts to all others
[[session]]
label = "broadcast-from-1"
src = 1
destinations = [2, 3, 4]

# Optional: Second session
[[session]]
label = "broadcast-from-2"
src = 2
destinations = [1, 3, 4]
