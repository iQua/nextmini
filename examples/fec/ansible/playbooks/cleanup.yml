- name: Stop controller containers
  hosts: controller
  gather_facts: false
  vars:
    run_id: "{{ run_id | default('fec-demo') }}"
    remote_run_dir: "{{ run_root }}/{{ run_id }}"
  tasks:
    - name: Stop controller and Postgres containers
      ansible.builtin.shell: docker rm -f fec-controller-{{ run_id }} fec-postgres-{{ run_id }} >/dev/null 2>&1 || true
      args:
        executable: /bin/bash

    - name: Remove remote run directory when requested
      ansible.builtin.file:
        path: "{{ remote_run_dir }}"
        state: absent
      when: purge_run_dir | default(false) | bool

- name: Stop node containers
  hosts: trainer:workers:relays
  gather_facts: false
  vars:
    run_id: "{{ run_id | default('fec-demo') }}"
    remote_run_dir: "{{ run_root }}/{{ run_id }}"
  tasks:
    - name: Stop node container
      ansible.builtin.shell: docker rm -f fec-{{ inventory_hostname }}-{{ run_id }} >/dev/null 2>&1 || true
      args:
        executable: /bin/bash

    - name: Remove remote run directory when requested
      ansible.builtin.file:
        path: "{{ remote_run_dir }}"
        state: absent
      when: purge_run_dir | default(false) | bool
