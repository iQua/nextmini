version: "3.8"

services:
  server:
    image: curl-server
    build:
      context: .
      dockerfile: src/Dockerfile.server
    ports:
      - "8080:8080"
    networks:
      - nextmini-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
