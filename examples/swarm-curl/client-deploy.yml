version: "3.8"

services:
  client:
    image: curl-client
    build:
      context: .
      dockerfile: src/Dockerfile.client
    networks:
      - nextmini-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - server
    # Client runs the curl command and exits
    # For continuous testing, you might want to add a loop or restart policy
