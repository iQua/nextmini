protocol = "tcp"

# scheduler_type can be "fifo" or "wrr"
scheduler_type = "fifo"

flow_transport = "reliable_unicast"

# creates a full mesh topology with 4 nodes
[topology]
type = "full_mesh"
full_mesh_config = { n_nodes = 4 }

# [[link_rates]]
# src_node_id = 1
# dst_node_id = 2
# # 5 Gbps ~= 625,000,000 bytes/sec
# rate = 625_000_000
# bucket_size = 625_000

# [[link_rates]]
# src_node_id = 3
# dst_node_id = 4
# rate = 1_000_000_000
# bucket_size = 10_250_000

# the route from node 1 and node 2 is [1, 3, 4, 2]
[[routes]]
route = [1, 2]

[[routes]]
route = [2, 1]

# the route for node 3 and node 4
[[routes]]
route = [3, 4]

[[routes]]
route = [4, 3]

# Test Flow 1: Reliable Unicast flow
[[flows]]
src_node_id = 1
dst_node_id = 2
flow_spec = { flow_len = { Bytes = 100_000_000_000 }, flow_weight = 1, flow_rate = 625_000_000, transport = "reliable_unicast" }

