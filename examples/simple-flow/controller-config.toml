protocol = "tcp"

# scheduler_type can be "fifo" or "wrr"
scheduler_type = "fifo"

flow_transport = "reliable_unicast"

# creates a full mesh topology with 4 nodes
[topology]
type = "full_mesh"
full_mesh_config = { n_nodes = 4 }

[[link_rates]]
src_node_id = 1
dst_node_id = 2
rate = 100_000_000
bucket_size = 9000

# the route from node 1 and node 2 is [1, 3, 4, 2]
[[routes]]
route = [1, 3, 4, 2]

[[routes]]
route = [2, 4, 3, 1]

# the route for node 3 and node 4
[[routes]]
route = [3, 4]

[[routes]]
route = [4, 3]

# Test Flow 1: Reliable Unicast flow 
[[flows]]
src_node_id = 1
dst_node_id = 2
flow_spec = { flow_len = { Bytes = 100_000_000 }, flow_weight = 1, flow_rate = 10_000_000, transport = "reliable_unicast" }

# Test Flow 2: Reliable Unicast flow
[[flows]]
src_node_id = 3
dst_node_id = 4
flow_spec = { flow_len = { Bytes = 50_000_000 }, flow_weight = 2, flow_rate = 5_000_000, transport = "reliable_unicast" }

