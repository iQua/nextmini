protocol = "tcp"

# Use weighted round-robin scheduler for flow priority support
scheduler_type = "wrr"

# Create 4-node full mesh topology
[topology]
type = "full_mesh"
full_mesh_config = { n_nodes = 4 }

# Routing protocol: shortest path
[routing]
protocol = "shortest_path"

# Optional: Set bandwidth limits for different links
# [[link_rates]]
# src_node_id = 3
# dst_node_id = 4
# rate = 1_000_000_000  # 1 Gbps for inference requests
# bucket_size = 90000
