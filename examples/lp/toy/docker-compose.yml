services:
  postgres:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgusr
      POSTGRES_PASSWORD: pgpwrd
      POSTGRES_DB: nextmini
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - ../../../controller/init.sql:/docker-entrypoint-initdb.d/init.sql

  controller:
    build:
      context: ../../../
      dockerfile: controller/Dockerfile
    image: nextmini_controller
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ./controller-config.toml:/var/nextmini/config.toml
    working_dir: /var/nextmini
    command: /bin/bash -c "sleep 2 && /var/nextmini/controller"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  node1:
    build:
      context: ../../../
      dockerfile: examples/lp/toy/Dockerfile
    image: nextmini_lp_toy_python
    depends_on:
      controller:
        condition: service_healthy
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    command:
      - /bin/bash
      - -c
      - |
        python /workspace/examples/lp/toy/toy_demo.py \
          --role source \
          --config examples/lp/toy/node1-config.toml && \
        echo "[node1] Demo completed successfully. Staying alive..." && \
        sleep infinity

  node2:
    image: nextmini_lp_toy_python
    depends_on:
      node1:
        condition: service_started
      controller:
        condition: service_healthy
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    command:
      - /bin/bash
      - -c
      - |
        python /workspace/examples/lp/toy/toy_demo.py \
          --role receiver \
          --config examples/lp/toy/node2-config.toml && \
        echo "[node2] Demo completed successfully. Staying alive..." && \
        sleep infinity

  node3:
    image: nextmini_lp_toy_python
    depends_on:
      node1:
        condition: service_started
      controller:
        condition: service_healthy
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    command:
      - /bin/bash
      - -c
      - |
        python /workspace/examples/lp/toy/toy_demo.py \
          --role receiver \
          --config examples/lp/toy/node3-config.toml && \
        echo "[node3] Demo completed successfully. Staying alive..." && \
        sleep infinity


