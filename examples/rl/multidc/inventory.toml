# Multi-DC inventory for WAN RL experiments
# This machine runs both controller (PostgreSQL) and one trainer node
#
# Run benchmark:
#   python examples/rl/scripts/multidc.py run-bench --inventory examples/rl/multidc/inventory.toml \
#     --bytes $((1 * 1024 * 1024 * 1024)) --rounds 5 --algorithm cf_bottleneck_mwu --batch-ssh

[ssh]
user = "root"
port = 22
identity_file = "~/.ssh/no-key"

[paths]
remote_repo_dir = "~/nextmini"

