# Multi-DC inventory for running the WAN broadcast microbenchmark.
#
# Assumptions (recommended for correctness):
# - One Nextmini node per VM (host-network containers bind fixed ports).
# - Open inbound ports:
#   - Controller VM: TCP 3000
#   - All node VMs: TCP 8080 + 8081
# - SSH key-based auth (use ssh-agent for passphrase keys).
#
# One-line run:
#   python examples/rl/scripts/multidc.py run-bench --inventory examples/rl/multidc/inventory.toml \
#     --bytes $((10 * 1024 * 1024 * 1024)) --rounds 20 --algorithm cf_bottleneck
#
# Keep containers for debugging:
#   ... --no-cleanup

[ssh]
user = "ubuntu"
port = 22
identity_file = "~/.ssh/id_rsa"

[paths]
# Remote directory where the nextmini repo will be synced.
remote_repo_dir = "~/skyrocket/nextmini"

[controller]
# SSH target for controller+postgres.
host = "203.0.113.10"
# Publicly reachable address for nodes to connect to.
public_ip = "203.0.113.10"

[[nodes]]
role = "trainer"
node_id = 1
host = "203.0.113.11"
public_ip = "203.0.113.11"
region = "us-east"

[[nodes]]
role = "worker"
rank = 0
node_id = 2
host = "203.0.113.12"
public_ip = "203.0.113.12"
region = "us-west"

[[nodes]]
role = "worker"
rank = 1
node_id = 3
host = "203.0.113.13"
public_ip = "203.0.113.13"
region = "eu-west"

# Optional relay nodes (no GPU required).
