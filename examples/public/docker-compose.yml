networks:
    network:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.16.8.0/24

services:
    postgres:
        container_name: postgres
        image: postgres:alpine
        hostname: postgres
        environment:
            POSTGRES_USER: pgusr
            POSTGRES_PASSWORD: pgpwrd
            POSTGRES_DB: nextmini
        ports:
            # Keep postgres accessible for debugging if needed
            - "5432:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
            interval: 5s
            timeout: 3s
            retries: 30
        # networks:
        #     network:
        #         ipv4_address: 172.16.8.2
        volumes:
            - ../../controller/init.sql:/docker-entrypoint-initdb.d/init.sql
        restart: unless-stopped

    controller:
        container_name: controller
        hostname: controller
        image: nextmini_controller
        build:
            context: ../../
            dockerfile: ./controller/Dockerfile
        # networks:
        #     network:
        #         ipv4_address: 172.16.8.3
        stdin_open: true
        volumes:
            - ./controller-config.toml:/var/nextmini/config.toml
        depends_on:
            - postgres
        ports:
            - "3000:3000"
        # The command assumes the controller binary is at /var/nextmini/controller
        command: /bin/bash -c "sleep 5 && /var/nextmini/controller"

    node1:
        container_name: node1
        hostname: node1
        image: nextmini_datapath
        build:
            context: ../../
            dockerfile: ./dataplane/Dockerfile
        networks:
            network:
                ipv4_address: 172.16.8.4
        stdin_open: true
        privileged: true
        volumes:
            # Use the specific config file we created for node1
            - ./node1-config.toml:/var/nextmini/config.toml
            - ../../tools/:/var/nextmini/tools
        depends_on:
            - controller

        ports:
            - "8080:8080"
            - "8081:8081"
        cap_add:
            - NET_ADMIN
        # The command starts the dataplane, connecting to the controller via its Docker network name.
        # The address MUST be a full URL with scheme.
        command: /bin/bash -c "sleep 7 && /var/nextmini/nextmini ws://209.38.72.97:3000"
