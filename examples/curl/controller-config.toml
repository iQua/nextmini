protocol = "tcp"

# Three Netxmini dataplane nodes in the topology
[topology]
type = "full_mesh"
full_mesh_config = { n_nodes = 5 }

# [routing]
# protocol = "shortest_path"


[[routes]]
# forward: external client (1) -> external server (7)
route = [1, 2, 3, 4, 5, 6, 7]

# [[routes]]
# # reverse: external server (7) -> external client (1)
# route = [7, 6, 5, 4, 3, 2, 1]

