# Nextmini Auto-Deploy Configuration
# One node per line, format: NODE_ID|NODE_IP:SSH_PORT|INTERFACE|DATAPLANE_PORT
# Lines starting with # are comments

# ============================================================
# Controller Configuration
# ============================================================
CONTROLLER_IP=206.12.89.244   # Controller IP address (or 'auto' for auto-detection)
CONTROLLER_PORT=3000           # Controller WebSocket port

# ============================================================
# SSH Configuration  
# ============================================================
SSH_USER=root                    # SSH username for remote nodes
SSH_KEY=./ssh/id_rsa             # Path to SSH private key (relative to auto-deploy directory)
REMOTE_DEPLOY_DIR=/opt/nextmini  # Deployment directory on remote nodes

# ============================================================
# Build Configuration
# ============================================================
SKIP_BUILD=false  # Set to 'true' to skip building binaries

# ============================================================
# Node List
# Format: NODE_ID|NODE_IP:SSH_PORT|INTERFACE|DATAPLANE_PORT
# 
# SSH_PORT is optional, defaults to 22 if not specified
# ============================================================
# 
# Examples:
#
# Standard SSH port (22):
# 1|192.168.1.101|eth0|8080
# 2|192.168.1.102|eth0|8080
#
# Custom SSH ports (like runpod):
# 1|69.30.85.171:22143|eth0|8080
# 2|69.30.85.172:33456|eth0|8080
#
# Same machine, different dataplane ports:
# 1|192.168.1.101:22|eth0|8080
# 2|192.168.1.101:22|eth0|8081
