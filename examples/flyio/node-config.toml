# Fly.io network interface (usually eth0)
private_network_interface = "eth0"
private_network_name = "flynet"
num_tun_queues = 1
num_packet_processors = 4
channel_capacity = 4000
queue_capacity = 3000
feature = "concurrent"

# Controller address for Fly.io deployment
controller_addr = "ws://nextmini-controller.internal:3000"
# Node ID - should be set differently for each node
node_id = 1
public_network_port = "8080"



