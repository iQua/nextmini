# Fly.io configuration for Nextmini Dataplane Node
# Note: You'll need to create separate apps for each node (e.g., nextmini-node-1, nextmini-node-2)
app = "nextmini-node-1"  # Change for each node
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.dataplane"
  # Build context is the repository root
  build-target = "runtime"

[env]
  RUST_LOG = "info"
  # NODE_ID = "1"  # Set via fly secrets for each node
  # CONTROLLER_ADDR = "ws://nextmini-controller.internal:3000"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080

# VM Configuration - requires privileged access for TUN device
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Mount config file
[[files]]
  guest_path = "/app/config.toml"
  local_path = "examples/flyio/node-config.toml"

# Auto-scaling configuration
[scaling]
  min_machines_running = 1
  max_machines_running = 1  # One machine per node

