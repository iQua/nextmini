protocol = "tcp"

[topology]
type = "full_mesh"
full_mesh_config = { n_nodes = 2 }

# Routes for 2-node setup
[[routes]]
route = [[1, 2]]

[[routes]]
route = [[2, 1]]

# Database configuration - use Fly.io PostgreSQL
# Note: On Fly.io, host will be set to <db-app-name>.internal automatically
# For local testing, use: host = "127.0.0.1"
[db]
user = "pgusr"
password = "pgpwrd"
host = "nextmini-db.internal"  # Will be <db-app-name>.internal on Fly.io
port = "5432"
database = "nextmini"

