services:
  postgres:
    image: postgres:16-alpine
    container_name: multicast-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgusr
      POSTGRES_PASSWORD: pgpwrd
      POSTGRES_DB: nextmini
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgusr", "-d", "nextmini"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - ../../controller/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      multicast:
        ipv4_address: 172.31.1.2

  controller:
    build:
      context: ../../
      dockerfile: controller/Dockerfile
    image: nextmini_controller
    container_name: multicast-controller
    hostname: controller
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ../../:/workspace:cached
      - ./controller-config.toml:/var/nextmini/config.toml
    working_dir: /var/nextmini
    command: /bin/bash -c "sleep 5 && /var/nextmini/controller"
    ports:
      - "3000:3000"
    networks:
      multicast:
        ipv4_address: 172.31.1.3

  source:
    build:
      context: ../../
      dockerfile: docs/testing/scripts/Dockerfile.harness
    image: nextmini_python_harness
    container_name: multicast-source
    hostname: source
    depends_on:
      controller:
        condition: service_started
    volumes:
      - ../../:/workspace:cached
      - ./artifacts:/artifacts
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      SKIP_BUILD: "${SKIP_BUILD:-0}"
      NEXTMINI_PY_WHEEL: "/workspace/target/wheels/nextmini_py-0.1.0-cp313-abi3-manylinux_2_38_x86_64.whl"
      ARTIFACT_DIR: "/artifacts"
    command:
      - bash
      - -lc
      - >
        examples/multicast-docker/scripts/run_multicast_node.sh source
        examples/multicast-docker/configs/node-source.toml
        --group-label ${GROUP_LABEL:-demo-multicast}
        --receiver-ids ${RECEIVER_IDS:-2,3}
        --payload-count ${PAYLOAD_COUNT:-8}
        --sleep-ms ${PAYLOAD_SLEEP_MS:-250}
        --group-timeout ${GROUP_TIMEOUT:-120}
        --member-timeout ${MEMBER_TIMEOUT:-90}
        --chunk-size ${CHUNK_SIZE:-1328}
        ${EXPECTED_BYTES:+--expected-bytes ${EXPECTED_BYTES}}
        ${TENSOR_PATH:+--tensor-path ${TENSOR_PATH}}
        ${VERIFY_CHECKSUM:+--verify-checksum}
        --artifact-dir ${ARTIFACT_DIR:-/artifacts}
    networks:
      multicast:
        ipv4_address: 172.31.1.10

  receiver_a:
    build:
      context: ../../
      dockerfile: docs/testing/scripts/Dockerfile.harness
    image: nextmini_python_harness
    container_name: multicast-receiver-a
    hostname: receiver-a
    depends_on:
      controller:
        condition: service_started
    volumes:
      - ../../:/workspace:cached
      - ./artifacts:/artifacts
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      SKIP_BUILD: "${SKIP_BUILD:-0}"
      NEXTMINI_PY_WHEEL: "/workspace/target/wheels/nextmini_py-0.1.0-cp313-abi3-manylinux_2_38_x86_64.whl"
      ARTIFACT_DIR: "/artifacts"
    command:
      - bash
      - -lc
      - >
        examples/multicast-docker/scripts/run_multicast_node.sh receiver
        examples/multicast-docker/configs/node-receiver-a.toml
        --group-label ${GROUP_LABEL:-demo-multicast}
        --node-id 2
        --source-node-id ${SOURCE_NODE_ID:-1}
        --payload-count ${RECEIVER_EXPECTED:-8}
        --group-timeout ${GROUP_TIMEOUT:-300}
        --member-timeout ${MEMBER_TIMEOUT:-240}
        --receive-timeout-ms ${RECEIVE_TIMEOUT_MS:-120000}
        --chunk-size ${CHUNK_SIZE:-1328}
        ${EXPECTED_BYTES:+--expected-bytes ${EXPECTED_BYTES}}
        ${SINK_PATH_A:+--sink-path ${SINK_PATH_A}}
        ${VERIFY_CHECKSUM:+--verify-checksum}
        --artifact-dir ${ARTIFACT_DIR:-/artifacts}
    networks:
      multicast:
        ipv4_address: 172.31.1.11

  receiver_b:
    build:
      context: ../../
      dockerfile: docs/testing/scripts/Dockerfile.harness
    image: nextmini_python_harness
    container_name: multicast-receiver-b
    hostname: receiver-b
    depends_on:
      controller:
        condition: service_started
    volumes:
      - ../../:/workspace:cached
      - ./artifacts:/artifacts
    working_dir: /workspace
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      SKIP_BUILD: "${SKIP_BUILD:-0}"
      NEXTMINI_PY_WHEEL: "/workspace/target/wheels/nextmini_py-0.1.0-cp313-abi3-manylinux_2_38_x86_64.whl"
      ARTIFACT_DIR: "/artifacts"
    command:
      - bash
      - -lc
      - >
        examples/multicast-docker/scripts/run_multicast_node.sh receiver
        examples/multicast-docker/configs/node-receiver-b.toml
        --group-label ${GROUP_LABEL:-demo-multicast}
        --node-id 3
        --source-node-id ${SOURCE_NODE_ID:-1}
        --payload-count ${RECEIVER_EXPECTED:-8}
        --group-timeout ${GROUP_TIMEOUT:-300}
        --member-timeout ${MEMBER_TIMEOUT:-240}
        --receive-timeout-ms ${RECEIVE_TIMEOUT_MS:-120000}
        --chunk-size ${CHUNK_SIZE:-1328}
        ${EXPECTED_BYTES:+--expected-bytes ${EXPECTED_BYTES}}
        ${SINK_PATH_B:+--sink-path ${SINK_PATH_B}}
        ${VERIFY_CHECKSUM:+--verify-checksum}
        --artifact-dir ${ARTIFACT_DIR:-/artifacts}
    networks:
      multicast:
        ipv4_address: 172.31.1.12

networks:
  multicast:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24
