reset_db = true
protocol = "quic"

# Forward routes: Node 1 to Node 4
[[routes]]
route = [1, 2, 3, 4]

[[routes]]
route = [1, 3, 2, 4]

[[routes]]
route = [1, 3, 4]

# Reverse routes: Node 4 to Node 1
[[routes]]
route = [4, 3, 2, 1]

[[routes]]
route = [4, 2, 3, 1]

[[routes]]
route = [4, 3, 1]

# Node 1 to Node 2
[[routes]]
route = [1, 2]

# Node 2 to Node 1
[[routes]]
route = [2, 1]
