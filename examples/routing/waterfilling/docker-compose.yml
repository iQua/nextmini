networks:
  network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.8.0/24

services:
  controller:
    container_name: controller
    hostname: controller
    image: strato_controller
    build:
      context: ../../../
      dockerfile: ./controller/Dockerfile
    networks:
      network:
        ipv4_address: 172.16.8.2
    stdin_open: true
    volumes:
      - ./controller-config.toml:/var/strato/server/config.toml
    ports:
      - 5432:5432
      - 3000:3000
    command: /bin/bash -c "/var/strato/server/target/release/controller"

  node1:
    container_name: node1
    hostname: node1
    image: strato_datapath
    build:
      context: ../../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      network:
        ipv4_address: 172.16.8.3
    stdin_open: true
    privileged: true
    volumes:
      - ./iperf3_c.sh:/var/node/iperf3_c.sh
      - ./config.toml:/var/node/config.toml
      - ../../../tools/:/var/node/tools
    depends_on:
      - controller
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "chmod +x iperf3_c.sh && sleep 7 && ./target/release/strato ws://controller:3000"

  node2:
    container_name: node2
    hostname: node2
    image: strato_datapath
    build:
      context: ../../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      network:
        ipv4_address: 172.16.8.4
    stdin_open: true
    privileged: true
    volumes:
      - ./iperf3_s.sh:/var/node/iperf3_s.sh
      - ./config.toml:/var/node/config.toml
      - ../../../tools/:/var/node/tools
    depends_on:
      - controller
      - node1
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "chmod +x iperf3_s.sh && sleep 7 && ./target/release/strato ws://controller:3000"

  node3:
    container_name: node3
    hostname: node3
    image: strato_datapath
    build:
      context: ../../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      network:
        ipv4_address: 172.16.8.5
    stdin_open: true
    privileged: true
    volumes:
      - ./config.toml:/var/node/config.toml
      - ../../../tools/:/var/node/tools
    depends_on:
      - controller
      - node2
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "sleep 7 && ./target/release/strato ws://controller:3000"

  node4:
    container_name: node4
    hostname: node4
    image: strato_datapath
    build:
      context: ../../../
      dockerfile: ./dataplane/Dockerfile
    networks:
      network:
        ipv4_address: 172.16.8.6
    stdin_open: true
    privileged: true
    volumes:
      - ./config.toml:/var/node/config.toml
      - ../../../tools/:/var/node/tools
    depends_on:
      - controller
      - node3
    cap_add:
      - NET_ADMIN
    command: /bin/bash -c "sleep 7 && ./target/release/strato ws://controller:3000"
